<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' clipkit:;" />
  <title>ClipKit — History</title>
  <link rel="stylesheet" href="history.css" />
</head>
<body>
  <div class="topbar">
    <input id="search" class="search" type="text" placeholder="Search clipboard history…" autocomplete="off" />
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-filter="all">All</button>
    <button class="tab" data-filter="text">Text</button>
    <button class="tab" data-filter="json">JSON</button>
    <button class="tab" data-filter="sql">SQL</button>
    <button class="tab" data-filter="csv">CSV</button>
    <button class="tab" data-filter="image">Image</button>
  </div>
  <div id="list" class="list"></div>
  <div id="empty" class="empty">No clipboard items yet.</div>

  <script src="transforms.js"></script>
  <script src="history.js"></script>
</body>
</html>
